[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdf-survey"
version = "0.1.0"
description = "GraphWorX32 GDF display survey, equipment grouping, and Excel/HTML reporting tool"
requires-python = ">=3.12"
dependencies = [
    "graphworx32-gdf-parser>=0.1.0",
    "openpyxl>=3.1.2,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
gdf-survey = "gdf_survey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
